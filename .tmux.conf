# prefix
unbind C-b
set -g prefix C-q

# disable escape delay
set-option -g escape-time 10

# focus relation neovim
set -g focus-events on

# window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r s split-window -v
bind -r Enter split-window -h

#reneme window
bind-key r command-prompt -I "#W" "rename-window '%%'"

# pane resizing with arrow keys
bind -r Up resize-pane -U 10
bind -r Down resize-pane -D 10
bind -r Left resize-pane -L 10
bind -r Right resize-pane -R 10

set -g mouse on
set -g mode-keys vi
set -g set-clipboard on

# copy and paste setting
bind-key -r v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X  copy-pipe-and-cancel "pbcopy"

# disable right click menu
unbind -n MouseDown3Pane
bind p paste-buffer
bind-key -n MouseDown3Pane paste-buffer

# improve colors
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",*256col*:Tc"

# non repeat
set-option -g repeat-time 10

# plugin maneger
# List of pluginjs
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "janoamaral/tokyo-night-tmux"

set -g @tokyo-night-tmux_theme moon
set -g @tokyo-night-tmux_transparent 1
set -g @tokyo-night-tmux_show_git 1             # local git status
set -g @tokyo-night-tmux_show_wbg 1             # GitHub / GitLab stats
set -g @tokyo-night-tmux_show_netspeed 1        # network speed
set -g @tokyo-night-tmux_show_battery_widget 1  # battery level
set -g @tokyo-night-tmux_show_music 1           # now playing
set -g @tokyo-night-tmux_show_path 1            # current path
set -g @tokyo-night-tmux_show_hostname 1        # machine hostname
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
